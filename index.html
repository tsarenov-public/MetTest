<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цитология — тестовый контроль</title>
<meta name="description" content="Интерактивные тесты по цитологии: 133 вопроса, 7 тестов и случайный режим.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230e8585'/><path d='M40 18h20v22h22v20H60v22H40V60H18V40h22z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0e8585; --teal-dark:#0a6368; --teal-deep:#084c52; --teal-soft:#e2f4f2;
  --ink:#0f3238; --muted:#5f7d82; --bg:#f1f8f7; --card:#fff; --line:#dcecec;
  --green:#1a9e5c; --green-soft:#e4f6ec; --red:#dd4b4b; --red-soft:#fdeeec;
  --shadow:0 12px 34px rgba(10,99,104,.10); --r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);min-height:100vh;
  background:radial-gradient(1100px 520px at 85% -5%,rgba(43,179,163,.16),transparent 60%),
  radial-gradient(900px 480px at -10% 25%,rgba(64,145,200,.10),transparent 55%),var(--bg);}
.wrap{max-width:1100px;margin:0 auto;padding:26px 20px 60px}
/* появление ЭКРАНА — только прозрачность, без сдвигов */
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* мягкая смена карточки вопроса — только прозрачность */
.qswap{animation:qfade .18s ease}
@keyframes qfade{from{opacity:.3}to{opacity:1}}

/* ---------- шапка ---------- */
.hero{position:relative;overflow:hidden;border-radius:26px;color:#fff;padding:34px 34px 44px;
  background:linear-gradient(120deg,#0a5e66,#0e8585 45%,#17a392);box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.18);right:40px;top:-110px;pointer-events:none}
.hero-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:relative;z-index:2}
.logo{width:64px;height:64px;border-radius:18px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.25);flex:0 0 auto}
.logo svg{width:38px;height:38px}
.hero h1{font-size:29px;font-weight:800;letter-spacing:.2px}
.hero .sub{opacity:.92;margin-top:6px;font-size:15px;max-width:660px;line-height:1.5}
.hstats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;position:relative;z-index:2}
.hchip{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);
  padding:8px 14px;border-radius:99px;font-size:13.5px;font-weight:500}
.ecg{position:absolute;right:-10px;bottom:6px;width:520px;max-width:85%;opacity:.35;pointer-events:none}
.ecg path{stroke:#fff;stroke-width:2.5;fill:none;stroke-dasharray:120 800;animation:ecg 5s linear infinite}
@keyframes ecg{from{stroke-dashoffset:920}to{stroke-dashoffset:0}}

/* ---------- секции и карточки тестов ---------- */
.section{margin-top:34px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head .bar{width:5px;height:26px;border-radius:4px;background:linear-gradient(#0e8585,#2bb3a3)}
.sec-head h2{font-size:21px;font-weight:700}
.sec-head .hint{color:var(--muted);font-size:13.5px;margin-left:auto}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:16px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;
  transition:transform .22s,box-shadow .22s,border-color .22s;box-shadow:0 4px 14px rgba(10,99,104,.05)}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:#bfe4e0}
.tcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.tnum{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:18px;color:#fff;background:linear-gradient(135deg,#0e8585,#2bb3a3);
  box-shadow:0 6px 14px rgba(14,133,133,.35)}
.tdone{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-weight:800}
.tname{font-size:17px;font-weight:700}
.trange{color:var(--muted);font-size:13.5px;margin-top:3px}
.tbest{margin-top:12px;font-size:13px;padding:7px 10px;border-radius:10px;background:var(--teal-soft);
  color:var(--teal-dark);font-weight:600;display:inline-block}
.tbest.none{background:#f2f6f6;color:#8aa0a3;font-weight:500}

/* ---------- случайный тест ---------- */
.rcard{border-radius:24px;color:#fff;padding:28px;position:relative;overflow:hidden;
  background:linear-gradient(120deg,#0b4f66,#0e7f86 50%,#159a86);box-shadow:var(--shadow)}
.rcard::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;
  border:2px dashed rgba(255,255,255,.15);right:-100px;bottom:-170px;pointer-events:none}
.rcard h3{font-size:22px;font-weight:800}
.rcard p{opacity:.93;margin-top:10px;max-width:760px;font-size:14.5px;line-height:1.55}
.rrow{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:20px;position:relative;z-index:2}
.rchip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:99px;
  padding:9px 16px;font-size:13.5px;font-weight:600}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:14px;
  font:600 15px 'Rubik',sans-serif;border:none;cursor:pointer;transition:transform .18s,box-shadow .18s,background .18s,border-color .18s;color:var(--teal-dark)}
.btn.primary{background:linear-gradient(135deg,#0e8585,#1fae9c);color:#fff;box-shadow:0 9px 22px rgba(14,133,133,.32)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(14,133,133,.4)}
.btn.ghost{background:#fff;border:2px solid var(--line);color:var(--teal-dark)}
.btn.ghost:hover{border-color:#a8d8d2;background:#f7fcfb}
.btn.light{background:#fff;color:var(--teal-deep)}
.btn.light:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.18)}
.btn.big{padding:16px 30px;font-size:16.5px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.again{cursor:pointer;color:var(--teal);text-decoration:underline dotted;font-size:14px;font-weight:600}

/* ---------- экран теста ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ttitle{font-size:19px;font-weight:700}
.tsub{color:var(--muted);font-size:13.5px;margin-top:2px;min-height:20px}
.pbar{margin:16px 0 4px;height:9px;background:#dceeee;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#0e8585,#2bb3a3);transition:width .35s ease}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px}
.pill{width:37px;height:37px;border-radius:11px;border:2px solid var(--line);background:#fff;color:#7d989c;
  font:600 13px 'Rubik',sans-serif;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.pill:hover{border-color:#9fd6d0;color:var(--teal-dark)}
.pill.done{background:var(--teal-soft);border-color:#bfe6e2;color:var(--teal-dark)}
.pill.cur{background:linear-gradient(135deg,#0e8585,#2bb3a3);border-color:transparent;color:#fff;
  box-shadow:0 5px 12px rgba(14,133,133,.35)}
.qcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:26px;box-shadow:0 6px 20px rgba(10,99,104,.06)}
.qchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--teal-soft);color:var(--teal-dark)}
.chip.type{background:#eef4fb;color:#2a6fa8}
.qtext{font-size:19px;font-weight:600;line-height:1.5}
.opts{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:13px;align-items:flex-start;border:2px solid #e2eeee;border-radius:14px;
  padding:14px 16px;cursor:pointer;transition:border-color .16s,background .16s;background:#fff;
  -webkit-tap-highlight-color:transparent;user-select:none}
.opt:hover{border-color:#a8d8d2;background:#f7fcfb}
.opt.sel{border-color:#0e8585;background:var(--teal-soft)}
.mk{flex:0 0 auto;width:22px;height:22px;border:2px solid #b9d4d4;margin-top:1px;position:relative;transition:background .15s,border-color .15s}
.mk.radio{border-radius:50%}
.mk.check{border-radius:7px}
.opt.sel .mk.radio{border-color:#0e8585}
.opt.sel .mk.radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:#0e8585}
.opt.sel .mk.check{background:#0e8585;border-color:#0e8585}
.opt.sel .mk.check::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;
  border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg)}
.onum{font-weight:700;color:#7fa0a4;margin-right:4px}
.otext{font-size:15px;line-height:1.45}
.qnav{display:flex;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}

/* ---------- результаты ---------- */
.rescard{background:#fff;border:1px solid var(--line);border-radius:26px;padding:36px 28px;text-align:center;box-shadow:var(--shadow)}
.ringwrap{position:relative;width:190px;height:190px;margin:10px auto 4px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:15;stroke-linecap:round}
.ring .bgc{stroke:#e4f1f0}
.ring .fgc{transition:stroke-dashoffset 1.3s cubic-bezier(.4,0,.2,1)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:40px;font-weight:800}
.ring-sub{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.verdict{font-size:23px;font-weight:800;margin-top:12px}
.resmeta{color:var(--muted);margin-top:6px;font-size:14.5px}
.reschips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.rchip2{padding:9px 16px;border-radius:12px;font-size:14px;font-weight:600}
.rchip2.ok{background:var(--green-soft);color:var(--green)}
.rchip2.bad{background:var(--red-soft);color:var(--red)}
.rchip2.skip{background:#f1f4f5;color:#7c9296}
.resbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.note{margin:18px auto 0;max-width:660px;background:#fdf6e3;border:1px solid #f0e0b0;color:#8a6d1a;
  padding:12px 16px;border-radius:12px;font-size:13.5px;line-height:1.5}

/* ---------- разбор ---------- */
.reviews{display:flex;flex-direction:column;gap:14px}
.rev{background:#fff;border:1px solid var(--line);border-left-width:5px;border-radius:16px;
  padding:18px 20px;box-shadow:0 4px 14px rgba(10,99,104,.05)}
.rev.ok{border-left-color:var(--green)}
.rev.bad{border-left-color:var(--red)}
.rev-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rev-num{font-weight:700;font-size:14px;color:var(--muted)}
.rev-status{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:99px}
.rev.ok .rev-status{background:var(--green-soft);color:var(--green)}
.rev.bad .rev-status{background:var(--red-soft);color:var(--red)}
.rev-q{margin-top:9px;font-weight:600;font-size:15.5px;line-height:1.5}
.rev-ans{margin-top:10px;font-size:14px;line-height:1.6;color:#33535a}
.ans-block{padding:10px 13px;border-radius:10px;margin-top:6px}
.ans-block.user-bad{background:var(--red-soft)}
.ans-block.user-ok{background:var(--green-soft)}
.ans-block.right{background:#f0faf5;border:1px dashed #bfe6cf}
.lbl{font-weight:700}

/* ---------- модалка, футер ---------- */
.modal{position:fixed;inset:0;background:rgba(8,52,58,.5);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal.hidden{display:none}
.modal-card{background:#fff;border-radius:20px;padding:28px;max-width:440px;width:100%;
  box-shadow:0 24px 60px rgba(0,0,0,.25);text-align:center;animation:fade .2s ease}
.modal-ico{width:54px;height:54px;margin:0 auto;border-radius:16px;background:var(--teal-soft);
  display:flex;align-items:center;justify-content:center;font-size:26px}
.modal-card p{font-size:16px;line-height:1.55;margin:14px 0 20px}
.modal-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.foot{margin-top:44px;text-align:center;color:#8aa2a5;font-size:13px;line-height:1.9}
.foot a{cursor:pointer;color:var(--teal);text-decoration:underline dotted}

@media (max-width:600px){
  .hero{padding:24px 20px 40px}
  .hero h1{font-size:23px}
  .qcard{padding:18px}
  .qnav{flex-direction:column-reverse}
  .qnav .btn{width:100%}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<div id="modal" class="modal hidden" onclick="if(event.target===this)hideModal()">
  <div class="modal-card">
    <div class="modal-ico">⚠️</div>
    <p id="modal-text"></p>
    <div class="modal-btns">
      <button class="btn ghost" onclick="hideModal()">Отмена</button>
      <button class="btn primary" id="modal-ok" onclick="modalOk()">Да</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ================= БАНК ВОПРОСОВ (133 шт.) =================
   a — индексы правильных вариантов (начиная с 0)             */
const QUESTIONS=[
{id:1,t:"Основными признаками различий живого и неживого являются:",o:["способность к самовоспроизведению","состав химических элементов","продолжительность существования в природе","пространственное построение","взаимосвязь с элементами других планет"],a:[0,2,3]},
{id:2,t:"Популяционно-видовой уровень организации живого — это:",o:["сообщество нескольких видов живого в едином ареале","исторически сложившаяся совокупность особей одного вида в одном ареале","сообщество организмов с одинаковыми морфо-физиологическими свойствами","некоторая часть акватории, заселенная живыми существами","совокупность клеток, образующих определенный вид ткани"],a:[1,2]},
{id:3,t:"Мейотическое деление клеток отличается от митотического:",o:["названием фаз происходящего процесса","клетками, осуществляющими деление","результатами разделения генетического аппарата","количеством клеток, образующихся в результате деления","состоянием ДНК в хромосомах на различных стадиях делений клеток"],a:[1,2,3,4]},
{id:4,t:"Набор хромосом в сперматозоиде человека может быть:",o:["23 аутосомы + Х и Y половые хромосомы","22 пары аутосом + Х или Y половые хромосомы","22 аутосомы + Х хромосома","22 аутосомы + Y хромосома","любой из указанных в зависимости от возраста мужчины"],a:[2,3]},
{id:5,t:"Перекрёст гомологичных хромосом при мейозе обеспечивает:",o:["формирование клеток с определённым набором половых хромосом","перекомбинирование генетического аппарата клетки","строгое сохранение родительских признаков у потомков","появление новых индивидуальных признаков у потомков","образование клеток с разным набором хромосом"],a:[1,3]},
{id:6,t:"Сущность клеточной теории заключается в:",o:["общности строения и функционирования клеток","различии проявлений основных свойств живого","возникновении новых клеток только путём деления предшествующих","однородности химического состава клеток","определении клетки как структурной и функциональной единицы живого"],a:[0,2,3,4]},
{id:7,t:"В профазе I мейотического деления происходит:",o:["удвоение ДНК","конъюгация гомологичных хромосом","расхождение гомологичных хромосом","кроссинговер и обмен генами в гомологичных хромосомах","экваториальное расположение гомологичных хромосом"],a:[1,3]},
{id:8,t:"Кроссинговер гомологичных хромосом в мейозе происходит на стадии:",o:["метафазы I","телофазы II","анафазы I","анафазы II","профазы I"],a:[4]},
{id:9,t:"Овогенез отличается от сперматогенеза:",o:["числом образующихся гамет","количеством половых хромосом, попадающих в гаметы","составом половых хромосом, попадающих в гаметы","местом прохождения процесса гаметогенеза","количеством аутосом в каждой гамете"],a:[0,2,3]},
{id:10,t:"Пол развивающегося организма человека зависит от:",o:["общего количества хромосом в зиготе","числа и состава половых хромосом в зиготе","вида половой хромосомы в сперматозоиде","вида половой хромосомы в яйцеклетке","состава аутосом в обеих половых клетках"],a:[1,2]},
{id:11,t:"В результате овогенеза из одной исходной клетки (овогония) образуются:",o:["три яйцеклетки и одна гаплоидная клетка без запаса желтка","одна яйцеклетка с запасом питательных веществ","три гаплоидные клетки без запаса питательных веществ","четыре половые клетки с одинаковым содержанием желтка","четыре клетки с одинаковым генетическим аппаратом"],a:[1,2,4]},
{id:12,t:"В результате сперматогенеза из одной исходной клетки (сперматогония) может образоваться:",o:["один сперматозоид","два сперматозоида с разным набором аутосом и половых хромосом","две пары сперматозоидов с разными половыми хромосомами","четыре сперматозоида с одинаковым набором аутосом","любое число сперматозоидов с одинаковым хромосомным составом"],a:[2,3]},
{id:13,t:"При оплодотворении происходит:",o:["проникновение сперматозоида в яйцо","слияние ядер обеих гамет","образование диплоидной клетки","активация зиготы к дроблению и развитию","образование зародышевых листков"],a:[0,1,2,3]},
{id:14,t:"Витальная микроскопия применяется с целью:",o:["установления тонкого строения отдельных органоидов клетки","изучения характера циклоза в клетке","изучения топографии органоидов в клетке","изучения физиологических процессов, происходящих в клетке","кариотипа клеток"],a:[1,3]},
{id:15,t:"Фокусное расстояние большого объектива (40х) микроскопа равно:",o:["около 1 см","0,5 мм","около 2 мм","0,5 см","0,2 см"],a:[2,4]},
{id:16,t:"К доклеточным формам жизни относятся:",o:["бактерии и дрожжи","вирусы и фаги","бурые и зелёные водоросли","грибы и папоротники","простейшие"],a:[1]},
{id:17,t:"Фиксирование клеток при цитологическом исследовании производят с целью:",o:["денатурации белковых молекул клеточных структур","прекращения всех жизненных процессов","изучения топографии органоидов в клетке","установления основных функций отдельных органоидов","определения назначения различных включений"],a:[0,1,2]},
{id:18,t:"Изотоническими называются среды, в которых:",o:["содержатся все химические элементы, необходимые для жизни клетки","клетка находится в состоянии оптимального тургора","концентрация солей соответствует таковой в клетке","клетки могут сохранять жизнеспособность вне организма","происходит гибель клеток"],a:[1,2,3]},
{id:19,t:"Состояние «лаковая кровь» возможно у человека в результате:",o:["естественной гибели эритроцитов","внутривенного вливания изотонических кровозаменителей","быстрого введения в ткани и кровь человека гипертонических растворов","внутривенного вливания большого количества гипотонических растворов","несовместимости крови при гемотрансфузиях"],a:[3]},
{id:20,t:"К прокариотам относятся:",o:["простейшие","вирусы и фаги","сине-зелёные водоросли","бактерии","дрожжи и грибы"],a:[2,3]},
{id:21,t:"Эукариотические клетки характеризуются:",o:["наличием белково-липидной оболочки, комплекса органоидов и ядра","наличием только целлюлозной оболочки, комплекса органоидов и включений","способностью к амитотическому и митотическому делению","отсутствием оформленного ядра","ядерной организацией наследственного аппарата"],a:[0,2,4]},
{id:22,t:"В молекулу ДНК входят:",o:["белки","углеводы","азотистые основания","аминокислоты","фосфаты"],a:[1,2,4]},
{id:23,t:"Органоидами клеток называют:",o:["специализированные структуры цитоплазмы","органические соединения, входящие в цитоплазму","содержимое ядра и ядрышек","постоянные структуры цитоплазмы","вещества, вырабатываемые клетками в разные периоды их жизни"],a:[0,3]},
{id:24,t:"К органоидам эукариотических клеток относятся:",o:["агранулярная ЭПС","гликоген в клетках печени","митохондрии и гранулярная ЭПС","клеточный центр и рибосомы","ядерный хроматин"],a:[0,2,3]},
{id:25,t:"При содержании в молекуле ДНК 23% адениловых нуклеотидов содержание цитидиловых составит:",o:["23%","77%","43%","17%","27%"],a:[4]},
{id:26,t:"Основными функциями лизосом в клетках являются:",o:["синтез молекул тРНК","сохранение цитоплазматической генетической информации","ферментативное разрушение чужеродных веществ, попавших в клетку","образование энергетического материала","защита клетки от внутриклеточных паразитов"],a:[2,4]},
{id:27,t:"Уровнями организации живого являются:",o:["атомарный","молекулярный","биосферный","галактический","организменный"],a:[1,2,4]},
{id:28,t:"Незаменимые аминокислоты — это:",o:["аминокислоты, которые нельзя заменить другим органическим веществом","аминокислоты, которые не могут синтезироваться животными","мономеры белка","аминокислоты, которые синтезируются только животными","органические соединения"],a:[1,2,4]},
{id:29,t:"Компонентами нуклеиновых кислот являются:",o:["белки, жиры, углеводы","аминокислоты, углеводы, фосфаты","углеводы, аминокислоты, азотистые основания","азотистые основания, углеводы, фосфаты","АТФ, аминокислоты, фосфаты"],a:[3]},
{id:30,t:"Комплементарными азотистыми основаниями в ДНК являются:",o:["аденин — гуанин","гуанин — тимин","тимин — аденин","цитозин — гуанин","гуанин — урацил"],a:[2,3]},
{id:31,t:"Порядок расположения нуклеотидов в молекуле ДНК определяет структуру:",o:["белковой молекулы","азотистого основания","информационной РНК","рибосом","аппарата Гольджи"],a:[0,2]},
{id:32,t:"Включениями в клетках могут быть:",o:["глыбки гликогена","гранулярный ретикулум","крахмальные зёрна","капельки жира","ядрышки"],a:[0,2,3]},
{id:33,t:"ДНК отличается от РНК:",o:["структурной единицей","молекулярным весом","составом углеводов","пространственным построением","назначением"],a:[1,2,3,4]},
{id:34,t:"Информационная РНК — это нуклеиновая кислота, которая:",o:["переносит аминокислоты на рибосомы","переносит генетическую информацию с ДНК","осуществляет синтез аминокислот","осуществляет перенос органических веществ через мембраны","синтезируется в ядре на ДНК"],a:[1,4]},
{id:35,t:"Нуклеиновые кислоты в клетках организма осуществляют:",o:["регуляцию энергетических процессов","хранение наследственной информации","участие в синтезе аминокислот","реализацию наследственной информации через синтез белков","сохранение морфологических и физиологических признаков"],a:[1,3,4]},
{id:36,t:"Клеточная теория объясняет:",o:["последовательность прохождения стадий клеточного цикла","сходство физиологических процессов в клетках","общность химического состава клеток","абиогенность происхождения жизни на Земле","общность строения клеток"],a:[1,2,4]},
{id:37,t:"Способностью накапливать запас питательных веществ в клетке обладают:",o:["пластиды","клеточный центр","рибосомы","вакуоли","лизосомы"],a:[0,3]},
{id:38,t:"Биология изучает:",o:["разнообразие форм неживой природы на планете Земля","факторы эволюции живого на Земле","формы взаимоотношений живого на Земле","взаимоположение планет Солнечной системы","закономерности наследственности и изменчивости живого"],a:[1,2,4]},
{id:39,t:"Положениями клеточной теории являются:",o:["клетки всех организмов сходны по химическому составу","продолжительность жизни клеток определяется их строением","все новые клетки образуются при делении исходных клеток","все организмы состоят из клеток","смерть организма наступает в результате гибели клеток"],a:[0,2,3]},
{id:40,t:"Методами цитологии являются:",o:["раздельное (фракционное) центрифугирование","клеточная инженерия","световая микроскопия","электронная микроскопия","изучение структуры биоценозов"],a:[0,1,2,3]},
{id:41,t:"Роль ядра в клетке состоит в:",o:["сохранении постоянства генетического кода","образовании энергетического материала","хранении наследственного материала клетки","синтезе аминокислот","осуществлении обменных процессов клетки"],a:[0,2]},
{id:42,t:"За счёт фагоцитоза происходит:",o:["разделение клетки на несколько частей","проникновение в клетку бактериофага","захват плазматической мембраной клетки твёрдых частиц","уничтожение бактерий, попавших в живой организм","питание некоторых простейших"],a:[2,3,4]},
{id:43,t:"За счёт пиноцитоза происходит:",o:["захват плазматической мембраной инородных твёрдых частиц","изменение физико-химического состояния цитоплазмы","разделение генетического аппарата клетки","активное проникновение в клетку жидкости","самоуничтожение клетки"],a:[1,3]},
{id:44,t:"Органоидами животных клеток являются:",o:["рибосомы","митохондрии","лизосомы","пластиды","эндоплазматическая сеть"],a:[0,1,2,4]},
{id:45,t:"Дезоксирибонуклеиновая кислота не содержится в клеточных структурах:",o:["митохондриях","рибосомах","лизосомах","ядре","комплексе Гольджи"],a:[1,2,4]},
{id:46,t:"Для профилактики заражения малярией необходимо:",o:["тщательно термически обрабатывать принимаемую пищу","избегать контактов с больными малярией","предохраняться от укусов комаров","уничтожать комаров на всех стадиях их жизненного цикла","осушать водоёмы — места выплода комаров"],a:[2,3,4]},
{id:47,t:"К органоидам, имеющим двумембранное строение, относятся:",o:["аппарат Гольджи","лизосомы и рибосомы","митохондрии и пластиды","эндоплазматическая сеть","центросомы и микротрубочки"],a:[2]},
{id:48,t:"Гетерохроматин хромосом образован:",o:["участками структурно изменённого белка","участками наиболее спирализованной ДНК","инактивированными участками ДНК","генами, не участвующими в биосинтетических процессах","вставками новых нуклеотидов"],a:[1,2,3]},
{id:49,t:"Число митохондрий в клетке зависит от:",o:["размера клетки","функциональной активности клетки","видовой принадлежности клетки","формы клетки","фазы жизненного цикла клетки"],a:[1,2,4]},
{id:50,t:"Живой организм обладает свойствами:",o:["самовоспроизведения","адаптации к среде обитания","кристаллизации","обмена веществ","минерализации"],a:[0,1,3]},
{id:51,t:"Эухроматин хромосом образован:",o:["участками деспирализованной ДНК","отрезками наиболее спирализованной ДНК","районами наиболее активного генетического материала","новыми комплексами нуклеопротеидов","генами, активно участвующими в биосинтетических процессах клеток"],a:[0,2,4]},
{id:52,t:"Прокариотические клетки отличаются от эукариотических:",o:["содержанием химических элементов","организацией наследственного аппарата","наличием митохондрий","составом органических веществ","способом питания"],a:[1,2,4]},
{id:53,t:"Гомологичные хромосомы характеризуются:",o:["одинаковым положением центромер","равными размерами","одинаковым типом строения","разным содержанием ДНК в хроматидах","разной длиной хроматид"],a:[0,1,2]},
{id:54,t:"Теломеры — это:",o:["центральные участки хромосом","концевые участки хромосом","название соматических хромосом","органоиды клетки","название телоцентрической хромосомы"],a:[1]},
{id:55,t:"Правило постоянства числа хромосом объясняет:",o:["видовые особенности кариотипа","эффективность мутагенного фактора","состояние генома организма","возможные хромосомные перестройки","распределение хромосом по группам"],a:[0,2,4]},
{id:56,t:"К включениям клеток относятся:",o:["хлоропласты","глыбки крахмала","кристаллы минеральных солей","капли жира","лизосомы"],a:[1,2,3]},
{id:57,t:"Основными функциями клеточного ядра являются:",o:["синтез ДНК","образование ядрышек","обеспечение межклеточных связей","хранение наследственной информации","сохранение химического состава цитоплазмы"],a:[0,1,3]},
{id:58,t:"В клеточном ядре не происходит:",o:["синтез белков","образование АТФ","образование органоидов","хранение генетической информации","образование нуклеиновых кислот"],a:[0,1,2]},
{id:59,t:"Гетеротрофными организмами являются:",o:["одноклеточные водоросли","вирусы","зелёные растения","многоклеточные беспозвоночные животные","высшие позвоночные животные"],a:[1,3,4]},
{id:60,t:"К автотрофным организмам относятся:",o:["низшие позвоночные животные","высшие позвоночные животные","одноклеточные простейшие из класса амёб","одноклеточные водоросли","многоклеточные зелёные растения"],a:[3,4]},
{id:61,t:"Свойствами живого не являются:",o:["обмен веществ","самовоспроизведение","минерализация","кристаллизация","адаптация к среде обитания"],a:[2,3]},
{id:62,t:"Эукариотические растительные клетки отличаются от животных:",o:["строением оболочек","составом органоидов","способом деления","организацией наследственного аппарата","формой и размерами"],a:[0,1,4]},
{id:63,t:"Кариотип — это:",o:["тип строения ядра эукариотической клетки","состав половых хромосом в гаметах","диплоидный набор хромосом в соматических клетках","общее число хромосом, характерное для определённого вида","организация наследственного аппарата клетки"],a:[2,3,4]},
{id:64,t:"Центромера — это:",o:["органоид клетки","участок наибольшей спирализации ДНК в хромосоме","участок наименьшей спирализации ДНК в хромосоме","участок хромосомы, разделяющий её на плечи","единица измерения хромосом"],a:[2,3]},
{id:65,t:"Спутники хромосом образуются за счёт:",o:["первичной перетяжки","вторичных перетяжек в теломерных районах","кроссинговера гомологичных хромосом в мейозе","нерасхождения хромосом в митозе","аберраций хромосом"],a:[1]},
{id:66,t:"Телоцентрические хромосомы в кариотипе человека могут быть в результате:",o:["межхромосомных транслокаций","парацентрических инверсий","утраты длинных плеч метацентрических хромосом","утраты коротких плеч акроцентрических хромосом","перицентрических инверсий"],a:[2,3]},
{id:67,t:"Дифференцированное окрашивание хромосом основано на:",o:["цветовом различии хромосом в кариотипе","специфичности окрашивания гетеро- и эухроматиновых районов хромосом","избирательном окрашивании отдельных хромосом определённым красителем","использовании культуры только определённых клеток","различии окраски спирализованных и деспирализованных участков хромосом"],a:[1,4]},
{id:68,t:"Сходство организмов, относящихся к одному виду, определяется:",o:["ареалом существования","набором видовых и индивидуальных белков","морфо-физиологическими особенностями","клеточным строением всех органов и частей тела","состоянием наследственного аппарата"],a:[0,1,2,4]},
{id:69,t:"Денверовская классификация хромосом применяется для:",o:["выявления хромосомных анеуплоидий","обнаружения хромосомных аберраций","составления идеограмм хромосом","определения генных мутаций","установления типов хромосом в кариотипе"],a:[0,1,2,4]},
{id:70,t:"Ферменты лизосом в клетках расщепляют:",o:["липиды","углеводы","воду","белки","минеральные соли"],a:[0,1,3]},
{id:71,t:"Методами биологических исследований являются:",o:["культура клеток и тканей","экспериментальный","геофизический","биохимический","биотехнологический"],a:[0,1,3,4]},
{id:72,t:"Структура гена зависит от:",o:["состава азотистых оснований","состава и последовательности нуклеотидов","состава и последовательности аминокислот","молекулярного веса ДНК","наличия мутации в ДНК"],a:[1,4]},
{id:73,t:"За счёт удвоения ДНК в клетках обеспечивается:",o:["сохранение генетической информации в поколениях клеток","синтез одинаковых белковых молекул дочерними клетками","выживание организмов в неблагоприятных условиях","многообразие форм воспроизводства организмов","появление новых форм жизни"],a:[0,1]},
{id:74,t:"В процессе редупликации ДНК не происходит:",o:["деспирализации ДНК","перекомбинирования генетического материала","образования новых нуклеотидов","сохранения генетической информации в новых молекулах ДНК","восстановления (репарации) ранее мутированных участков"],a:[1,2,4]},
{id:75,t:"Принцип комплементарности построения ДНК заключается в:",o:["последовательности азотистых оснований на одной нити ДНК","соответствии азотистых оснований на обеих нитях ДНК","последовательности расположения дезоксирибозы","количественном составе нуклеотидов в молекуле ДНК","определении общей протяжённости молекулы ДНК"],a:[1]},
{id:76,t:"Ген представляет собой:",o:["матрицу для синтеза белка","единицу наследственности живого организма","место синтеза нуклеиновых кислот","некоторую последовательность нуклеотидов","мономер белка"],a:[0,1,3]},
{id:77,t:"На этапах биосинтеза белка в клетке происходит:",o:["транскрипция генетического кода","рекомбинация генов","удвоение органоидов клетки","трансляция генетической информации","спирализация ДНК"],a:[0,3]},

/* ================= СОСТОЯНИЕ И ХРАНИЛИЩЕ ================= */
const SIZE=20;
const app=document.getElementById('app');
const chunks=[];
for(let i=0;i<QUESTIONS.length;i+=SIZE)chunks.push(QUESTIONS.slice(i,i+SIZE));

const load=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let best=load('cyto.best.v1',{});
let usedRandom=load('cyto.used.v1',[]);
const state={test:null,result:null};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a}

/* ================= ГЛАВНАЯ ================= */
function renderHome(){
  state.test=null;state.result=null;
  const doneSeq=Object.keys(best).length;
  const randomLeft=QUESTIONS.length-usedRandom.length;
  const cards=chunks.map((c,i)=>{
    const b=best[i];
    return '<div class="tcard" onclick="startSeq('+i+')">'+
      '<div class="tcard-top"><div class="tnum">'+(i+1)+'</div>'+(b?'<div class="tdone">✓</div>':'')+'</div>'+
      '<div class="tname">Тест '+(i+1)+'</div>'+
      '<div class="trange">Вопросы '+c[0].id+'–'+c[c.length-1].id+' · '+c.length+' вопр.</div>'+
      '<div class="tbest'+(b?'':' none')+'">'+(b?('Лучший: '+b.pct+'% ('+b.score+' из '+b.total+')'):'Ещё не пройден')+'</div></div>';
  }).join('');
  app.innerHTML='<div class="view">'+
  '<div class="hero">'+
    '<div class="hero-row">'+
      '<div class="logo"><svg viewBox="0 0 24 24"><path d="M9.5 3h5a1 1 0 0 1 1 1v4.5H20a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-4.5V20a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-4.5H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h4.5V4a1 1 0 0 1 1-1Z" fill="#fff"/></svg></div>'+
      '<div><h1>Цитология · Тест</h1>'+
      '<p class="sub">'+' </p></div>'+
    '</div>'+
    '<div class="hstats">'+
      '<span class="hchip">🧬 '+QUESTIONS.length+' вопроса</span>'+
      '<span class="hchip">📋 7 тестов по порядку</span>'+
      '<span class="hchip">🎲 Случайный режим</span>'+
      '<span class="hchip">✅ Пройдено: '+doneSeq+' из '+chunks.length+'</span>'+
    '</div>'+
    '<svg class="ecg" viewBox="0 0 520 60"><path d="M0 32 H110 l12 0 8-16 10 32 8-16 h70 l10 0 8-22 12 44 8-22 h96 l10 0 6-12 8 24 6-12 H520"/></svg>'+
  '</div>'+
  '<div class="section">'+
    '<div class="sec-head"><div class="bar"></div><h2>Тесты по порядку</h2><span class="hint">пройдено '+doneSeq+' из '+chunks.length+'</span></div>'+
    '<div class="tgrid">'+cards+'</div>'+
  '</div>'+
  '<div class="section">'+
    '<div class="sec-head"><div class="bar"></div><h2>Случайный режим</h2></div>'+
    '<div class="rcard"><h3>🎲 Случайный тест</h3>'+
    '<p>Система выбирает 20 случайных вопросов из всей базы. Вопросы, на которые вы уже ответили в этом режиме, не повторяются. </p>'+
    '<div class="rrow"><span class="rchip">Осталось нерешённых: '+randomLeft+' из '+QUESTIONS.length+'</span>'+
    '<button class="btn light big" onclick="startRandom()">Начать случайный тест →</button></div></div>'+
  '</div>'+
  '<div class="foot"><br>'+
  '<a onclick="resetProgress()">Сбросить прогресс</a></div>'+
  '</div>';
  window.scrollTo(0,0);
}

/* ================= ЗАПУСК ТЕСТОВ ================= */
function startSeq(i){
  state.test={mode:'seq',seq:i,items:chunks[i],answers:{},cur:0,mixed:false,fresh:chunks[i].length};
  renderTest();
}
function buildRandom(){
  let usedSet=new Set(usedRandom);
  let unused=QUESTIONS.filter(q=>!usedSet.has(q.id));
  if(unused.length===0){usedRandom=[];save('cyto.used.v1',usedRandom);unused=QUESTIONS.slice();usedSet=new Set()}
  let items,mixed=false;
  if(unused.length>=SIZE){items=shuffle(unused).slice(0,SIZE)}
  else{
    const usedItems=QUESTIONS.filter(q=>usedSet.has(q.id));
    items=unused.concat(shuffle(usedItems).slice(0,SIZE-unused.length));
    mixed=true;
  }
  return{items:shuffle(items),mixed,fresh:Math.min(unused.length,SIZE)};
}
function startRandom(){
  const b=buildRandom();
  state.test={mode:'rand',seq:-1,items:b.items,answers:{},cur:0,mixed:b.mixed,fresh:b.fresh};
  renderTest();
}

/* ================= ЭКРАН ТЕСТА (каркас рисуется ОДИН раз) ================= */
function renderTest(){
  const t=state.test;
  const title=t.mode==='seq'?('Тест '+(t.seq+1)+' из '+chunks.length):'Случайный тест';
  app.innerHTML='<div class="view">'+
    '<div class="topbar"><button class="btn ghost" onclick="exitTest()">← Выйти</button>'+
    '<div><div class="ttitle">'+title+'</div><div class="tsub" id="tsub"></div></div></div>'+
    '<div class="pbar"><i id="pfill" style="width:0%"></i></div>'+
    '<div class="pills" id="pills"></div>'+
    '<div class="qcard" id="qcard"></div>'+
    '<div class="qnav"><button class="btn ghost" id="btnPrev">← Назад</button>'+
    '<button class="btn primary" id="btnNext">Далее →</button></div>'+
  '</div>';
  document.getElementById('btnPrev').onclick=prevQ;
  showQuestion(0);
  window.scrollTo(0,0);
}

/* смена вопроса: обновляется ТОЛЬКО содержимое карточки и счётчики */
function showQuestion(i){
  const t=state.test,n=t.items.length;
  t.cur=i;
  const q=t.items[i];
  const sel=t.answers[q.id]||[];
  const multi=q.a.length>1;
  const answered=t.items.filter(x=>(t.answers[x.id]||[]).length>0).length;
  document.getElementById('tsub').textContent='Вопрос '+(i+1)+' из '+n+' · отвечено: '+answered;
  document.getElementById('pfill').style.width=(((i+1)/n)*100)+'%';
  document.getElementById('pills').innerHTML=t.items.map((it,k)=>{
    const cls=k===i?'cur':(((t.answers[it.id]||[]).length)?'done':'');
    return '<button class="pill '+cls+'" onclick="goTo('+k+')">'+(k+1)+'</button>';
  }).join('');
  const opts=q.o.map((o,k)=>{
    const on=sel.indexOf(k)>=0;
    return '<div class="opt'+(on?' sel':'')+'" onclick="selectOpt('+k+')">'+
      '<span class="mk '+(multi?'check':'radio')+'"></span>'+
      '<span class="otext"><span class="onum">'+(k+1)+')</span>'+o+'</span></div>';
  }).join('');
  const qcard=document.getElementById('qcard');
  qcard.innerHTML='<div class="qchips"><span class="chip">Вопрос №'+q.id+'</span>'+
    '<span class="chip type">'+(multi?'Несколько ответов':'Один ответ')+'</span></div>'+
    '<div class="qtext">'+q.t+'</div><div class="opts" id="opts">'+opts+'</div>';
  qcard.classList.remove('qswap');void qcard.offsetWidth;qcard.classList.add('qswap');
  const bp=document.getElementById('btnPrev'),bn=document.getElementById('btnNext');
  bp.disabled=(i===0);
  if(i===n-1){bn.textContent='Завершить тест ✓';bn.onclick=tryFinish;}
  else{bn.textContent='Далее →';bn.onclick=nextQ;}
}

/* клик по ответу: меняются ТОЛЬКО классы — без перерисовки */
function selectOpt(oi){
  const t=state.test,q=t.items[t.cur];
  let sel=(t.answers[q.id]||[]).slice();
  if(q.a.length===1){sel=[oi]}
  else{const i=sel.indexOf(oi);if(i>=0)sel.splice(i,1);else sel.push(oi)}
  t.answers[q.id]=sel;
  document.querySelectorAll('#opts .opt').forEach((node,i)=>{
    node.classList.toggle('sel',sel.indexOf(i)>=0);
  });
  const pills=document.querySelectorAll('#pills .pill');
  if(pills[t.cur])pills[t.cur].classList.toggle('done',sel.length>0);
  const answered=t.items.filter(x=>(t.answers[x.id]||[]).length>0).length;
  document.getElementById('tsub').textContent='Вопрос '+(t.cur+1)+' из '+t.items.length+' · отвечено: '+answered;
}

function goTo(i){if(i===state.test.cur)return;showQuestion(i);fixScroll()}
function nextQ(){const t=state.test;if(t.cur<t.items.length-1){showQuestion(t.cur+1);fixScroll()}}
function prevQ(){const t=state.test;if(t.cur>0){showQuestion(t.cur-1);fixScroll()}}
function fixScroll(){
  const el=document.getElementById('qcard');
  if(!el)return;
  const top=el.getBoundingClientRect().top;
  if(top<0)window.scrollTo({top:window.scrollY+top-16,behavior:'smooth'});
}
function exitTest(){showModal('Выйти из теста? Ответы не сохранятся.','Выйти',renderHome)}
function tryFinish(){
  const t=state.test;
  const un=t.items.filter(q=>!(t.answers[q.id]&&t.answers[q.id].length)).length;
  if(un>0){showModal('Вы не ответили на '+un+' вопрос(ов). Всё равно завершить тест?','Завершить',doFinish)}
  else doFinish();
}

/* ================= РЕЗУЛЬТАТЫ ================= */
function commitRandom(ids){
  const s=new Set(usedRandom);
  ids.forEach(id=>s.add(id));
  usedRandom=(s.size>=QUESTIONS.length)?[]:Array.from(s);
  save('cyto.used.v1',usedRandom);
}
function doFinish(){
  const t=state.test,total=t.items.length;
  const results=t.items.map(q=>{
    const sel=(t.answers[q.id]||[]).slice().sort((a,b)=>a-b);
    const cor=q.a.slice().sort((a,b)=>a-b);
    const ok=sel.length===cor.length&&sel.every((v,i)=>v===cor[i]);
    return{q,sel,ok};
  });
  const score=results.filter(r=>r.ok).length;
  const pct=Math.round(score/total*100);
  if(t.mode==='seq'){
    if(!best[t.seq]||pct>best[t.seq].pct)best[t.seq]={pct,score,total};
    save('cyto.best.v1',best);
  }else{
    commitRandom(t.items.map(q=>q.id));
  }
  state.result={results,score,total,pct,mode:t.mode,seq:t.seq,mixed:t.mixed,fresh:t.fresh};
  renderResult();
}
function renderResult(){
  const r=state.result,C=2*Math.PI*80;
  const wrong=r.results.filter(x=>!x.ok&&x.sel.length>0).length;
  const skipped=r.results.filter(x=>x.sel.length===0).length;
  const col=r.pct>=90?'#1a9e5c':r.pct>=75?'#0e8585':r.pct>=50?'#dd9a10':'#dd4b4b';
  const verdict=r.pct>=90?'Отличный результат!':r.pct>=75?'Хороший результат!':r.pct>=50?'Неплохо — стоит повторить':'Нужно повторить материал';
  const testTitle=r.mode==='seq'?('Тест '+(r.seq+1)+' · вопросы '+r.results[0].q.id+'–'+r.results[r.results.length-1].q.id):'Случайный тест';
  let nextBtn;
  if(r.mode==='rand')nextBtn='<button class="btn primary" onclick="startRandom()">Дальше: новый случайный тест →</button>';
  else if(r.seq<chunks.length-1)nextBtn='<button class="btn primary" onclick="startSeq('+(r.seq+1)+')">Продолжить: Тест '+(r.seq+2)+' →</button>';
  else nextBtn='<button class="btn primary" onclick="startSeq('+r.seq+')">Пройти ещё раз ↻</button>';
  const retry=(r.mode==='seq'&&r.seq<chunks.length-1)?'<div style="margin-top:16px"><span class="again" onclick="startSeq('+r.seq+')">↻ Пройти этот тест ещё раз</span></div>':'';
  const note=r.mixed?'<div class="note">ℹ️ Нерешённые вопросы почти закончились: в этом тесте '+r.fresh+' новых вопросов и '+(SIZE-r.fresh)+' из уже решённых. Цикл завершён — следующий случайный тест начнётся заново со всеми '+QUESTIONS.length+' вопросами.</div>':'';
  const reviews=r.results.map(x=>{
    const corTxt=x.q.a.map(i=>(i+1)+') '+x.q.o[i]).join('<br>');
    const userTxt=x.sel.length?x.sel.map(i=>(i+1)+') '+x.q.o[i]).join('<br>'):'Вы не дали ответа';
    const body=x.ok
      ?'<div class="ans-block user-ok"><span class="lbl">Ваш ответ (верно):</span><br>'+corTxt+'</div>'
      :'<div class="ans-block user-bad"><span class="lbl">Ваш ответ:</span><br>'+userTxt+'</div>'+
       '<div class="ans-block right"><span class="lbl">Правильный ответ:</span><br>'+corTxt+'</div>';
    return '<div class="rev '+(x.ok?'ok':'bad')+'">'+
      '<div class="rev-head"><span class="rev-num">Вопрос №'+x.q.id+'</span>'+
      '<span class="rev-status">'+(x.ok?'Верно':(x.sel.length?'Неверно':'Нет ответа'))+'</span></div>'+
      '<div class="rev-q">'+x.q.t+'</div><div class="rev-ans">'+body+'</div></div>';
  }).join('');
  app.innerHTML='<div class="view">'+
    '<div class="rescard">'+
      '<div class="resmeta" style="margin-top:0">'+testTitle+'</div>'+
      '<div class="ringwrap"><svg class="ring" width="190" height="190">'+
      '<circle class="bgc" cx="95" cy="95" r="80"/>'+
      '<circle class="fgc" id="ringfg" cx="95" cy="95" r="80" style="stroke:'+col+';stroke-dasharray:'+C+';stroke-dashoffset:'+C+'"/></svg>'+
      '<div class="ring-center"><div class="ring-pct" id="ringpct" style="color:'+col+'">0%</div><div class="ring-sub">результат</div></div></div>'+
      '<div class="verdict" style="color:'+col+'">'+verdict+'</div>'+
      '<div class="resmeta">Решено '+r.score+' из '+r.total+' вопросов</div>'+
      '<div class="reschips"><span class="rchip2 ok">✓ Верно: '+r.score+'</span>'+
      '<span class="rchip2 bad">✗ Ошибки: '+wrong+'</span>'+
      '<span class="rchip2 skip">– Пропущено: '+skipped+'</span></div>'+
      note+
      '<div class="resbtns"><button class="btn ghost" onclick="renderHome()">⌂ На главную</button>'+nextBtn+'</div>'+
      retry+
    '</div>'+
    '<div class="sec-head" style="margin-top:34px"><div class="bar"></div><h2>Разбор ответов</h2></div>'+
    '<div class="reviews">'+reviews+'</div>'+
  '</div>';
  window.scrollTo(0,0);
  requestAnimationFrame(()=>setTimeout(()=>{
    const fg=document.getElementById('ringfg');
    if(fg)fg.style.strokeDashoffset=C*(1-r.pct/100);
    animateCount(document.getElementById('ringpct'),r.pct);
  },80));
}
function animateCount(el,target){
  if(!el)return;
  let v=0;const step=Math.max(1,Math.round(target/45));
  (function tick(){v=Math.min(target,v+step);el.textContent=v+'%';if(v<target)requestAnimationFrame(tick)})();
}

/* ================= МОДАЛКА И ПРОЧЕЕ ================= */
let modalCb=null;
function showModal(text,okLabel,cb){
  document.getElementById('modal-text').textContent=text;
  document.getElementById('modal-ok').textContent=okLabel||'Подтвердить';
  modalCb=cb;
  document.getElementById('modal').classList.remove('hidden');
}
function hideModal(){document.getElementById('modal').classList.add('hidden');modalCb=null}
function modalOk(){const cb=modalCb;hideModal();if(cb)cb()}
function resetProgress(){
  showModal('Сбросить весь прогресс: лучшие результаты тестов и историю случайного режима?','Сбросить',()=>{
    best={};usedRandom=[];
    save('cyto.best.v1',best);save('cyto.used.v1',usedRandom);
    renderHome();
  });
}

renderHome();
</script>
